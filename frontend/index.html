<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Posez des questions à vos documents PDF et obtenez des réponses sourcées." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Assistant RAG — interrogez vos documents</title>
    <script>
      // Apply the theme before first paint to avoid a white flash in dark mode.
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var dark = stored ? stored === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
