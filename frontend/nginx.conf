# Serves the React build and forwards /api/* to the FastAPI container.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Up to 10 PDFs of 20 MB per upload (MAX_FILES_PER_UPLOAD x MAX_UPLOAD_MB).
    client_max_body_size 210m;

    # The app has no user accounts: anyone who reaches it can upload documents and spend
    # API credits. On a public server, protect it, for example with HTTP basic auth:
    #   htpasswd -c ./htpasswd moi   (then mount the file and uncomment the two lines below)
    # auth_basic "Assistant RAG";
    # auth_basic_user_file /etc/nginx/htpasswd;

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streaming answers (Server-Sent Events): send each token as soon as it arrives.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Hashed assets never change: cache them for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: unknown paths serve index.html.
    location / {
        try_files $uri /index.html;
    }
}
