[project]
name = "rag-assistant-backend"
version = "0.1.0"
description = "API FastAPI de l'assistant RAG : ingestion de PDF, recherche sémantique, chat avec sources."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.18",
    "pymupdf>=1.25",
    "sentence-transformers>=3.3",
    "torch>=2.5",
    "anthropic>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.uv]
package = false

# CPU-only PyTorch: the default Linux wheel bundles CUDA (several GB) that we do not need.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs a real PostgreSQL + pgvector database (skipped if unreachable)",
    "model: loads the real embedding model (skipped unless RUN_MODEL_TESTS=1)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]

[tool.ruff.lint.isort]
# The local `alembic/` folder must not make ruff think the package is first-party.
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["app"]

[[tool.mypy.overrides]]
module = ["pgvector.*", "pymupdf.*", "fitz.*", "sentence_transformers.*"]
ignore_missing_imports = true
